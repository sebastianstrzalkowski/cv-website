name: Build and Deploy to AWS S3

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: portfolio-prod-cdn-origin
      CLOUDFRONT_DISTRIBUTION_ID: E3IBBG5UTPIXN0

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          BUCKET="s3://${{ env.S3_BUCKET }}"

          # Hashed assets never change under the same name: cache for a year.
          aws s3 cp build/assets "$BUCKET/assets" --recursive \
            --cache-control "public, max-age=31536000, immutable"

          # Images, icons, PDF: a day in caches, revalidated afterwards.
          aws s3 cp build "$BUCKET" --recursive \
            --exclude "assets/*" --exclude "index.html" --exclude "sitemap.xml" --exclude "robots.txt" \
            --cache-control "public, max-age=86400"

          # Entry points must always be revalidated so a deploy is visible immediately.
          for file in index.html sitemap.xml robots.txt; do
            aws s3 cp "build/$file" "$BUCKET/$file" --cache-control "no-cache"
          done

          # Remove files that no longer exist in the build (sizes match, so nothing is re-uploaded).
          aws s3 sync build "$BUCKET" --delete --size-only

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Verify deployment
        run: |
          # Check cloudfront invalidation status
          INVALIDATION_ID=$(aws cloudfront list-invalidations \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'InvalidationList.Items[0].Id' \
            --output text)
          
          echo "Waiting for CloudFront invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID
          
          echo "Deployment completed successfully!"
